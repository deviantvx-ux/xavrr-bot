<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAVRR GIFT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070a0f;
      --surface: #0e141e;
      --surface-2: #151e2c;
      --text: #f3f7ff;
      --muted: #8a99b3;
      --accent: #00d4b6;
      --gold: #f5b400;
      --green: #16a34a;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 86px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: rgba(7, 10, 15, 0.94);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 20; gap: 8px;
    }
    .user-box { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      display: grid; place-items: center; font-weight: 800; color: #070a0f;
    }
    .bal-label { font-size: 0.72rem; color: var(--muted); }
    .bal-val { font-weight: 800; font-size: 1rem; }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .lang-btn {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 7px 9px; font-weight: 700; font-size: 0.75rem; cursor: pointer;
    }
    .topup-btn {
      background: var(--accent); color: #061014; border: 0;
      border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 0.84rem; cursor: pointer;
    }
    main { max-width: 560px; margin: 0 auto; padding: 14px; }
    .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .case-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; display: flex;
      flex-direction: column; justify-content: space-between; cursor: pointer;
    }
    .case-art {
      position: relative; height: 142px; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, rgba(0, 212, 182, 0.18), rgba(14, 20, 30, 0.96));
    }
    .case-badge {
      position: absolute; top: 10px; font-size: 0.66rem; font-weight: 800;
      padding: 3px 9px; border-radius: 999px; background: rgba(7, 10, 15, 0.75);
      color: var(--gold); border: 1px solid rgba(245, 180, 0, 0.35);
    }
    .case-emoji { font-size: 2.9rem; margin-top: 10px; }
    .case-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--surface-2); gap: 8px;
    }
    .case-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price-pill {
      background: var(--accent); color: #061014; font-weight: 800;
      font-size: 0.8rem; padding: 5px 9px; border-radius: 8px; white-space: nowrap;
    }
    .price-pill.free { background: var(--green); color: #fff; }
    .case-modal-card, .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px;
    }
    .back-link {
      background: transparent; color: var(--muted); border: 0;
      font-weight: 700; font-size: 0.88rem; padding: 0 0 12px 0; cursor: pointer;
    }
    .reel-wrap {
      position: relative; background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 8px; margin: 12px 0; overflow: hidden;
    }
    .reel-track { display: flex; gap: 8px; transition: transform 0.9s cubic-bezier(0.16, 0.88, 0.22, 1); }
    .reel-slot {
      min-width: 84px; height: 84px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 1.65rem; gap: 4px;
    }
    .reel-slot span { font-size: 0.66rem; color: var(--muted); font-weight: 700; }
    .reel-marker {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
      background: var(--gold); transform: translateX(-50%); pointer-events: none;
    }
    .spin-cta {
      width: 100%; background: var(--gold); color: #0b0d12; border: 0;
      border-radius: 12px; padding: 13px; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    }
    .drops-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .drop-tile {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; text-align: center;
    }
    .drop-price { font-size: 0.78rem; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
    .drop-title { font-weight: 700; font-size: 0.88rem; margin-top: 6px; }
    .row-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px;
    }
    .mini-btn {
      background: var(--accent); color: #061014; border: 0;
      border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: 0.78rem; cursor: pointer;
    }
    .mini-btn.alt { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; background: #0b1018;
      border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px; z-index: 20;
    }
    .nav-btn {
      background: transparent; border: 0; color: var(--muted); font-size: 0.68rem;
      font-weight: 700; display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding: 6px 2px; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn span.ico { font-size: 1.15rem; }
    .hidden { display: none; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 40;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 420px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 18px; padding: 18px;
    }
    .seg-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg);
      padding: 4px; border-radius: 12px; margin: 12px 0; gap: 4px;
    }
    .seg-tabs button {
      background: transparent; color: var(--muted); border: 0;
      border-radius: 9px; padding: 8px; font-weight: 700; cursor: pointer;
    }
    .seg-tabs button.active { background: var(--accent); color: #061014; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="user-box">
      <div class="avatar" id="user-avatar">X</div>
      <div>
        <div class="bal-label" id="bal-label">Ваш баланс • XAVRR GIFT</div>
        <div class="bal-val" id="balance-display">💎 100.0</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="lang-btn" id="lang-toggle-btn">UK</button>
      <button class="topup-btn" id="open-topup-btn">Поповнити</button>
    </div>
  </header>

  <main>
    <section id="view-home">
      <div class="cases-grid" id="cases-grid"></div>
      <div class="case-modal-card hidden" id="case-detail">
        <button class="back-link" id="back-to-cases">← Назад</button>
        <div id="detail-title" style="font-weight:800; font-size:1.1rem;"></div>
        <div id="detail-sub" style="color:var(--muted); font-size:0.84rem; margin-top:2px;"></div>
        <div class="reel-wrap">
          <div class="reel-marker"></div>
          <div class="reel-track" id="reel-track"></div>
        </div>
        <button class="spin-cta" id="spin-case-btn">Відкрити кейс</button>
        <div id="spin-status" style="margin-top:10px; font-weight:700; text-align:center; color:var(--gold);"></div>
        <div class="drops-grid" id="detail-drops"></div>
      </div>
    </section>

    <section id="view-inv" class="hidden">
      <div class="panel">
        <div id="inv-title" style="font-weight:800; font-size:1.05rem; margin-bottom:10px;">Інвентар</div>
        <div id="inv-container" style="color:var(--muted);"></div>
      </div>
    </section>

    <section id="view-invite" class="hidden">
      <div class="panel">
        <div id="invite-title" style="font-weight:800; font-size:1.05rem; margin-bottom:8px;">Запросити друзів</div>
        <p id="invite-desc" style="color:var(--muted); font-size:0.88rem; margin-top:0;"></p>
        <button class="spin-cta" id="copy-promo-btn"></button>
        <div id="invite-feedback" style="margin-top:10px; color:var(--gold); font-weight:700;"></div>
      </div>
    </section>

    <section id="view-rating" class="hidden">
      <div class="panel">
        <div id="rating-title" style="font-weight:800; font-size:1.05rem; margin-bottom:10px;">Рейтинг</div>
        <div class="row-item"><span>🥇 <b>King_XAVRR</b></span><b>41.4M</b></div>
        <div class="row-item"><span>🥈 <b>Dubai_NFT</b></span><b>19.0M</b></div>
        <div class="row-item"><span>🥉 <b>Pepe_Dealer</b></span><b>16.7M</b></div>
        <div class="row-item"><span>4. <b>Shadow_Crown</b></span><b>14.9M</b></div>
      </div>
    </section>

    <section id="view-rewards" class="hidden">
      <div class="panel">
        <div id="rewards-title" style="font-weight:800; font-size:1.05rem; margin-bottom:8px;">Нагороди та VIP</div>
        <div class="row-item"><span>🥉 <b>Bronze</b></span><span style="color:var(--muted);">5 000</span></div>
        <div class="row-item"><span>🥈 <b>Silver</b></span><span style="color:var(--muted);">10 000</span></div>
        <div class="row-item"><span>🥇 <b>Gold</b></span><span style="color:var(--muted);">25 000</span></div>
        <div class="row-item"><span>💎 <b>Platinum XAVRR</b></span><span style="color:var(--gold);">VIP</span></div>
      </div>
    </section>
  </main>
    <div class="modal-backdrop" id="topup-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <b id="modal-title">Поповнення балансу</b>
        <button class="mini-btn alt" id="close-topup-btn">✕</button>
      </div>
      <div class="seg-tabs">
        <button class="active" data-pay="GRAM">GRAM</button>
        <button data-pay="Stars">Stars</button>
        <button data-pay="Gifts">Gifts</button>
      </div>
      <button class="spin-cta" id="add-test-balance-btn">+50.0 💎</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn" data-view="inv"><span class="ico">📦</span><span id="nav-inv">Інвентар</span></button>
    <button class="nav-btn" data-view="invite"><span class="ico">👥</span><span id="nav-invite">Друзі</span></button>
    <button class="nav-btn active" data-view="home"><span class="ico">🏠</span><span id="nav-home">Головна</span></button>
    <button class="nav-btn" data-view="rating"><span class="ico">🏆</span><span id="nav-rating">Рейтинг</span></button>
    <button class="nav-btn" data-view="rewards"><span class="ico">🎁</span><span id="nav-rewards">Нагороди</span></button>
  </nav>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

      var I18N = {
        uk: {
          bal: "Ваш баланс • XAVRR GIFT", topup: "Поповнити", back: "← Назад",
          openCase: "Відкрити кейс", noBal: "Недостатньо балансу!", won: "Випало",
          emptyInv: "Інвентар порожній.", sell: "Продати", withdraw: "Вивід",
          invTitle: "Інвентар", inviteTitle: "Запросити друзів",
          inviteDesc: "Запрошуйте друзів через бота та активуйте промокод XAVRR.",
          promoBtn: "Промокод XAVRR (+50.0)", promoOk: "Активовано! +50.0 💎",
          promoUsed: "Вже активовано.", ratingTitle: "Рейтинг",
          rewardsTitle: "Нагороди та VIP", modalTitle: "Поповнення балансу",
          navInv: "Інвентар", navInvite: "Друзі", navHome: "Головна",
          navRating: "Рейтинг", navRewards: "Нагороди", freeText: "Безкоштовно", costText: "Ціна"
        },
        en: {
          bal: "Your balance • XAVRR GIFT", topup: "Top up", back: "← Back",
          openCase: "Open case", noBal: "Not enough balance!", won: "Won",
          emptyInv: "Inventory is empty.", sell: "Sell", withdraw: "Withdraw",
          invTitle: "Inventory", inviteTitle: "Invite friends",
          inviteDesc: "Invite friends via the bot and activate promo code XAVRR.",
          promoBtn: "Promo XAVRR (+50.0)", promoOk: "Activated! +50.0 💎",
          promoUsed: "Already activated.", ratingTitle: "Leaderboard",
          rewardsTitle: "Rewards & VIP", modalTitle: "Top up balance",
          navInv: "Inventory", navInvite: "Invite", navHome: "Home",
          navRating: "Rating", navRewards: "Rewards", freeText: "Free case", costText: "Price"
        },
        ru: {
          bal: "Ваш баланс • XAVRR GIFT", topup: "Пополнить", back: "← Назад",
          openCase: "Открыть кейс", noBal: "Недостаточно баланса!", won: "Выпало",
          emptyInv: "Инвентарь пуст.", sell: "Продать", withdraw: "Вывод",
          invTitle: "Инвентарь", inviteTitle: "Пригласить друзей",
          inviteDesc: "Приглашайте друзей через бота и активируйте промокод XAVRR.",
          promoBtn: "Промокод XAVRR (+50.0)", promoOk: "Активировано! +50.0 💎",
          promoUsed: "Уже активирован.", ratingTitle: "Рейтинг",
          rewardsTitle: "Награды и VIP", modalTitle: "Пополнение баланса",
          navInv: "Инвентарь", navInvite: "Друзья", navHome: "Главная",
          navRating: "Рейтинг", navRewards: "Награды", freeText: "Бесплатный кейс", costText: "Цена"
        }
      };

      var state = { lang: "uk", balance: 100.0, activeCase: null, inventory: [], promoUsed: false };

      var CASES = [
        { id: "free24", badge: "FREE24", name: "Free 24h", price: 0, free: true, emoji: "💍", drops: [
          { name: "B-Day Candle", value: 1.5, emoji: "🕯️" },
          { name: "Santa Hat", value: 3.0, emoji: "🎅" },
          { name: "Homemade Cake", value: 6.5, emoji: "🎂" }
        ]},
        { id: "free", badge: "FREE", name: "Free", price: 0, free: true, emoji: "🎁", drops: [
          { name: "Ice Cream", value: 2.0, emoji: "🍨" },
          { name: "Loot Bag", value: 5.0, emoji: "🎒" },
          { name: "Victory Medal", value: 9.0, emoji: "🏅" }
        ]},
        { id: "farm", badge: "FARM", name: "Farm", price: 0.5, emoji: "🐸", drops: [
          { name: "Homemade Cake", value: 0.8, emoji: "🎂" },
          { name: "Scared Cat", value: 1.6, emoji: "🐱" },
          { name: "Artisan Brick", value: 3.2, emoji: "🧱" }
        ]},
        { id: "dubai", badge: "DUBAI", name: "Дубай", price: 5.0, emoji: "🏙️", drops: [
          { name: "Artisan Brick", value: 4.5, emoji: "🧱" },
          { name: "Precious Peach", value: 9.0, emoji: "🍑" },
          { name: "Durov's Cap", value: 18.0, emoji: "🧢" }
        ]},
        { id: "telegram", badge: "NEW", name: "Telegram", price: 5.0, emoji: "✈️", drops: [
          { name: "Victory Medal", value: 4.0, emoji: "🏅" },
          { name: "Astral Shard", value: 8.5, emoji: "🔮" },
          { name: "Resistance Dog", value: 16.0, emoji: "🐕" }
        ]},
        { id: "pepe", badge: "HIT", name: "Pepe", price: 15.0, emoji: "🐸", drops: [
          { name: "Scared Cat", value: 12.0, emoji: "🐱" },
          { name: "Heart Locket", value: 26.0, emoji: "💖" },
          { name: "Plush Pepe", value: 55.0, emoji: "🐸" }
        ]},
        { id: "vip", badge: "VIP", name: "VIP", price: 25.0, emoji: "👑", drops: [
          { name: "Durov's Cap", value: 22.0, emoji: "🧢" },
          { name: "Heart Locket", value: 42.0, emoji: "💖" },
          { name: "Plush Pepe", value: 85.0, emoji: "🐸" }
        ]},
        { id: "elite", badge: "ELITE", name: "Elite", price: 50.0, emoji: "💎", drops: [
          { name: "Astral Shard", value: 40.0, emoji: "🔮" },
          { name: "Resistance Dog", value: 78.0, emoji: "🐕" },
          { name: "Plush Pepe", value: 150.0, emoji: "🐸" }
        ]}
      ];

      function t(key) { return (I18N[state.lang] && I18N[state.lang][key]) || I18N.uk[key] || key; }

      function applyTexts() {
        document.getElementById("lang-toggle-btn").textContent = state.lang.toUpperCase();
        document.getElementById("bal-label").textContent = t("bal");
        document.getElementById("open-topup-btn").textContent = t("topup");
        document.getElementById("back-to-cases").textContent = t("back");
        document.getElementById("spin-case-btn").textContent = t("openCase");
        document.getElementById("inv-title").textContent = t("invTitle");
        document.getElementById("invite-title").textContent = t("inviteTitle");
        document.getElementById("invite-desc").textContent = t("inviteDesc");
        document.getElementById("copy-promo-btn").textContent = t("promoBtn");
        document.getElementById("rating-title").textContent = t("ratingTitle");
        document.getElementById("rewards-title").textContent = t("rewardsTitle");
        document.getElementById("modal-title").textContent = t("modalTitle");
        document.getElementById("nav-inv").textContent = t("navInv");
        document.getElementById("nav-invite").textContent = t("navInvite");
        document.getElementById("nav-home").textContent = t("navHome");
        document.getElementById("nav-rating").textContent = t("navRating");
        document.getElementById("nav-rewards").textContent = t("navRewards");
        document.getElementById("balance-display").textContent = "💎 " + Number(state.balance).toFixed(1);
        renderCasesGrid();
        renderInventory();
      }

      document.getElementById("lang-toggle-btn").addEventListener("click", function () {
        var order = ["uk", "en", "ru"];
        state.lang = order[(order.indexOf(state.lang) + 1) % order.length];
        applyTexts();
      });

      function openCaseDetail(c) {
        state.activeCase = c;
        document.getElementById("cases-grid").classList.add("hidden");
        document.getElementById("case-detail").classList.remove("hidden");
        document.getElementById("detail-title").textContent = c.emoji + " " + c.name;
        document.getElementById("detail-sub").textContent = c.free ? t("freeText") : (t("costText") + ": " + c.price + " 💎");
        document.getElementById("spin-status").textContent = "";

        var track = document.getElementById("reel-track");
        track.style.transition = "none";
        track.style.transform = "translateX(0px)";
        track.innerHTML = "";
        for (var i = 0; i < 16; i++) {
          var d = c.drops[i % c.drops.length];
          var slot = document.createElement("div");
          slot.className = "reel-slot";
          slot.innerHTML = d.emoji + "<span>" + d.name + "</span>";
          track.appendChild(slot);
        }

        var dropsGrid = document.getElementById("detail-drops");
        dropsGrid.innerHTML = "";
        for (var j = 0; j < c.drops.length; j++) {
          var drop = c.drops[j];
          var tile = document.createElement("div");
          tile.className = "drop-tile";
          tile.innerHTML = '<div class="drop-price">' + drop.value + ' 💎</div><div style="font-size:2rem;">' + drop.emoji + '</div><div class="drop-title">' + drop.name + '</div>';
          dropsGrid.appendChild(tile);
        }
      }

      function renderCasesGrid() {
        var grid = document.getElementById("cases-grid");
        grid.innerHTML = "";
        for (var i = 0; i < CASES.length; i++) {
          (function (c) {
            var card = document.createElement("div");
            card.className = "case-card";
            card.innerHTML = '<div class="case-art"><div class="case-badge">' + c.badge + '</div><div class="case-emoji">' + c.emoji + '</div></div><div class="case-footer"><div class="case-name">' + c.name + '</div><div class="price-pill ' + (c.free ? "free" : "") + '">' + (c.free ? "FREE" : c.price) + '</div></div>';
            card.addEventListener("click", function () { openCaseDetail(c); });
            grid.appendChild(card);
          })(CASES[i]);
        }
      }

      function renderInventory() {
        var box = document.getElementById("inv-container");
        if (!state.inventory.length) { box.textContent = t("emptyInv"); return; }
        box.innerHTML = "";
        for (var i = 0; i < state.inventory.length; i++) {
          (function (item) {
            var row = document.createElement("div");
            row.className = "row-item";
            row.innerHTML = '<div>' + item.emoji + ' <b>' + item.name + '</b> <span style="color:var(--gold);">' + item.value + ' 💎</span></div><div style="display:flex; gap:6px;"><button class="mini-btn sell-btn">' + t("sell") + '</button><button class="mini-btn alt wd-btn">' + t("withdraw") + '</button></div>';
            row.querySelector(".sell-btn").addEventListener("click", function () {
              state.balance += item.value;
              state.inventory = state.inventory.filter(function (x) { return x.id !== item.id; });
              applyTexts();
            });
            row.querySelector(".wd-btn").addEventListener("click", function () {
              if (tg) { try { tg.sendData(JSON.stringify({ action: "withdraw", item_name: item.name, value: item.value })); } catch (e) {} }
              alert(item.name);
            });
            box.appendChild(row);
          })(state.inventory[i]);
        }
      }

      document.getElementById("back-to-cases").addEventListener("click", function () {
        document.getElementById("case-detail").classList.add("hidden");
        document.getElementById("cases-grid").classList.remove("hidden");
      });

      document.getElementById("spin-case-btn").addEventListener("click", function () {
        var c = state.activeCase;
        if (!c) return;
        if (state.balance < c.price) { document.getElementById("spin-status").textContent = t("noBal"); return; }
        state.balance -= c.price;
        document.getElementById("balance-display").textContent = "💎 " + Number(state.balance).toFixed(1);
        var won = c.drops[Math.floor(Math.random() * c.drops.length)];
        var track = document.getElementById("reel-track");
        track.style.transition = "transform 0.9s cubic-bezier(0.16, 0.88, 0.22, 1)";
        track.style.transform = "translateX(-280px)";
        setTimeout(function () {
          document.getElementById("spin-status").textContent = t("won") + ": " + won.emoji + " " + won.name + " (" + won.value + " 💎)";
          state.inventory.unshift({ id: Date.now() + Math.random(), name: won.name, value: won.value, emoji: won.emoji });
          renderInventory();
        }, 920);
      });

      document.getElementById("copy-promo-btn").addEventListener("click", function () {
        if (!state.promoUsed) {
          state.promoUsed = true; state.balance += 50;
          document.getElementById("invite-feedback").textContent = t("promoOk");
          applyTexts();
        } else {
          document.getElementById("invite-feedback").textContent = t("promoUsed");
        }
      });

      var modal = document.getElementById("topup-modal");
      document.getElementById("open-topup-btn").addEventListener("click", function () { modal.classList.add("open"); });
      document.getElementById("close-topup-btn").addEventListener("click", function () { modal.classList.remove("open"); });
      document.getElementById("add-test-balance-btn").addEventListener("click", function () {
        state.balance += 50; modal.classList.remove("open"); applyTexts();
      });

      var views = ["home", "inv", "invite", "rating", "rewards"];
      var navBtns = document.querySelectorAll(".nav-btn");
      for (var n = 0; n < navBtns.length; n++) {
        navBtns[n].addEventListener("click", function () {
          for (var m = 0; m < navBtns.length; m++) navBtns[m].classList.remove("active");
          this.classList.add("active");
          var target = this.getAttribute("data-view");
          for (var v = 0; v < views.length; v++) {
            var sec = document.getElementById("view-" + views[v]);
            if (views[v] === target) sec.classList.remove("hidden"); else sec.classList.add("hidden");
          }
        });
      }

      applyTexts();
    })();
  </script>
</body>
</html>
