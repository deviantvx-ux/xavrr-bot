<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #07090e;
      --surface: #0e131d;
      --surface-2: #151d2b;
      --text: #f3f7ff;
      --muted: #8b9bb4;
      --accent: #00d4b6;
      --gold: #f5b400;
      --green: #16a34a;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 88px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: rgba(7, 9, 14, 0.95);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 20; gap: 8px;
    }
    .user-box { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      display: grid; place-items: center; font-weight: 900; color: #06090e;
    }
    .user-meta { font-size: 0.68rem; color: var(--muted); }
    .bal-val { font-weight: 800; font-size: 0.98rem; }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .lang-btn {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 7px 9px; font-weight: 800; font-size: 0.74rem; cursor: pointer;
    }
    .topup-btn {
      background: var(--accent); color: #061014; border: 0;
      border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 0.84rem; cursor: pointer;
    }
    main { max-width: 560px; margin: 0 auto; padding: 14px; }
    .profile-strip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; gap: 8px;
    }
    .profile-name { font-weight: 800; font-size: 0.88rem; }
    .profile-id { font-size: 0.72rem; color: var(--muted); }
    .wallet-tag {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 9px; padding: 6px 9px; font-size: 0.72rem; font-weight: 700; color: var(--accent);
    }
    .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .case-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; display: flex;
      flex-direction: column; justify-content: space-between; cursor: pointer;
    }
    .case-art {
      position: relative; height: 142px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 10px; text-align: center;
      background: radial-gradient(circle at top, rgba(0, 212, 182, 0.2), rgba(14, 19, 29, 0.96));
    }
    .case-badge {
      position: absolute; top: 9px; font-size: 0.64rem; font-weight: 800;
      padding: 3px 9px; border-radius: 999px; background: rgba(7, 9, 14, 0.78);
      color: var(--gold); border: 1px solid rgba(245, 180, 0, 0.35);
    }
    .nft-emblem {
      margin-top: 12px; padding: 9px 12px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(0, 212, 182, 0.14), rgba(245, 180, 0, 0.14));
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-weight: 900; font-size: 0.8rem; letter-spacing: 0.04em; color: var(--text);
    }
    .case-sub { font-size: 0.68rem; color: var(--muted); margin-top: 6px; }
    .case-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--surface-2); gap: 8px;
    }
    .case-name { font-weight: 700; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price-pill {
      background: var(--accent); color: #061014; font-weight: 800;
      font-size: 0.8rem; padding: 5px 9px; border-radius: 8px; white-space: nowrap;
    }
    .price-pill.free { background: var(--green); color: #fff; }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px; margin-bottom: 12px;
    }
    .back-link {
      background: transparent; color: var(--muted); border: 0;
      font-weight: 700; font-size: 0.88rem; padding: 0 0 10px 0; cursor: pointer;
    }
    .reel-wrap {
      position: relative; background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 8px; margin: 12px 0; overflow: hidden;
    }
    .reel-track { display: flex; gap: 8px; transition: transform 0.9s cubic-bezier(0.16, 0.88, 0.22, 1); }
    .reel-slot {
      min-width: 112px; height: 82px; border-radius: 12px; padding: 6px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 3px;
    }
    .reel-slot b { font-size: 0.74rem; color: var(--text); }
    .reel-slot span { font-size: 0.64rem; color: var(--gold); font-weight: 700; }
    .reel-marker {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
      background: var(--gold); transform: translateX(-50%); pointer-events: none;
    }
    .spin-cta {
      width: 100%; background: var(--gold); color: #090c10; border: 0;
      border-radius: 12px; padding: 13px; font-weight: 800; font-size: 0.94rem; cursor: pointer;
    }
    .drops-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .drop-tile {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; text-align: center;
    }
    .drop-price { font-size: 0.78rem; color: var(--gold); font-weight: 800; }
    .drop-title { font-weight: 800; font-size: 0.88rem; margin-top: 6px; }
    .drop-meta { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
    .row-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px;
    }
    .mini-btn {
      background: var(--accent); color: #061014; border: 0;
      border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: 0.76rem; cursor: pointer;
    }
    .mini-btn.alt { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .upg-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .upg-slot {
      background: var(--surface-2); border: 1px dashed rgba(0, 212, 182, 0.45);
      border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 0.74rem; min-height: 64px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; background: #0a0e16;
      border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 2px; z-index: 20;
    }
    .nav-btn {
      background: transparent; border: 0; color: var(--muted); font-size: 0.65rem;
      font-weight: 700; display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 6px 1px; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn span.ico { font-size: 1.08rem; }
    .hidden { display: none; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 40;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 420px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 18px; padding: 18px;
    }
    .seg-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg);
      padding: 4px; border-radius: 12px; margin: 12px 0; gap: 4px;
    }
    .seg-tabs button {
      background: transparent; color: var(--muted); border: 0;
      border-radius: 9px; padding: 8px; font-weight: 700; cursor: pointer;
    }
    .seg-tabs button.active { background: var(--accent); color: #061014; }
  </style>

        { id: "king_vault", badge: "KING VAULT", name: "XAVRR King", tag: "HIGH ROLLER", price: 80.0, free: false, drops: [
          { nft: "Astral Shard", code: "SHARD", rarity: "Epic", value: 60.0 },
          { nft: "Durov's Cap", code: "DUROV CAP", rarity: "Mythic", value: 125.0 },
          { nft: "Plush Pepe", code: "PLUSH PEPE", rarity: "Legendary", value: 240.0 }
        ]},
        { id: "mythic_crown", badge: "MYTHIC VIP", name: "Mythic Crown", tag: "VIP NFT", price: 150.0, free: false, drops: [
          { nft: "Resistance Dog", code: "RES DOG", rarity: "Mythic", value: 115.0 },
          { nft: "Heart Locket", code: "LOCKET", rarity: "Mythic", value: 220.0 },
          { nft: "Plush Pepe", code: "PLUSH PEPE", rarity: "Legendary", value: 420.0 }
        ]}
      ];

      var state = {
        lang: "uk",
        wallet: "GRAM",
        balance: 150.0,
        activeCase: null,
        inventory: [
          { id: 101, nft: "Homemade Cake", code: "CAKE", rarity: "Common", value: 4.5, serial: "#412" },
          { id: 102, nft: "Loot Bag", code: "LOOT BAG", rarity: "Rare", value: 6.0, serial: "#1089" },
          { id: 103, nft: "Victory Medal", code: "MEDAL", rarity: "Rare", value: 8.0, serial: "#77" }
        ],
        selectedUpgradeIds: [],
        promoUsed: false
      };

      function t(k) { return (I18N[state.lang] && I18N[state.lang][k]) || I18N.uk[k] || k; }
      function makeSerial() { return "#" + Math.floor(10 + Math.random() * 4990); }

      function applyTexts() {
        document.getElementById("lang-toggle-btn").textContent = state.lang.toUpperCase();
        document.getElementById("bal-label").textContent = t("bal");
        document.getElementById("open-topup-btn").textContent = t("topup");
        document.getElementById("wallet-status").textContent = "WALLET: " + state.wallet;
        document.getElementById("back-to-cases").textContent = t("back");
        document.getElementById("spin-case-btn").textContent = t("openCase");
        document.getElementById("inv-title").textContent = t("invTitle");
        document.getElementById("upg-title").textContent = t("upgTitle");
        document.getElementById("upg-desc").textContent = t("upgDesc");
        document.getElementById("run-upgrade-btn").textContent = t("upgBtn");
        document.getElementById("upg-pool-title").textContent = t("upgPool");
        document.getElementById("invite-title").textContent = t("inviteTitle");
        document.getElementById("invite-desc").textContent = t("inviteDesc");
        document.getElementById("copy-promo-btn").textContent = t("promoBtn");
        document.getElementById("rating-title").textContent = t("ratingTitle");
        document.getElementById("modal-title").textContent = t("modalTitle");
        document.getElementById("nav-inv").textContent = t("navInv");
        document.getElementById("nav-upg").textContent = t("navUpg");
        document.getElementById("nav-home").textContent = t("navHome");
        document.getElementById("nav-invite").textContent = t("navInvite");
        document.getElementById("nav-rating").textContent = t("navRating");
        document.getElementById("balance-display").textContent = "💎 " + Number(state.balance).toFixed(1);
        renderCasesGrid();
        renderInventory();
        renderUpgrade();
      }

      document.getElementById("lang-toggle-btn").addEventListener("click", function () {
        var order = ["uk", "en", "ru"];
        state.lang = order[(order.indexOf(state.lang) + 1) % order.length];
        applyTexts();
      });

      var payBtns = document.querySelectorAll(".seg-tabs button");
      for (var p = 0; p < payBtns.length; p++) {
        payBtns[p].addEventListener("click", function () {
          for (var q = 0; q < payBtns.length; q++) payBtns[q].classList.remove("active");
          this.classList.add("active");
          state.wallet = this.getAttribute("data-pay") || "GRAM";
          document.getElementById("wallet-status").textContent = "WALLET: " + state.wallet;
        });
      }

      function openCaseDetail(c) {
        state.activeCase = c;
        document.getElementById("cases-grid").classList.add("hidden");
        document.getElementById("case-detail").classList.remove("hidden");
        document.getElementById("detail-title").textContent = "[" + c.tag + "] " + c.name;
        document.getElementById("detail-sub").textContent = c.free ? t("freeText") : (t("costText") + ": " + c.price + " 💎");
        document.getElementById("spin-status").textContent = "";

        var track = document.getElementById("reel-track");
        track.style.transition = "none";
        track.style.transform = "translateX(0px)";
        track.innerHTML = "";
        for (var i = 0; i < 16; i++) {
          var d = c.drops[i % c.drops.length];
          var slot = document.createElement("div");
          slot.className = "reel-slot";
          slot.innerHTML = "<b>" + d.nft + "</b><span>" + d.value + " 💎</span>";
          track.appendChild(slot);
        }

        var dropsGrid = document.getElementById("detail-drops");
        dropsGrid.innerHTML = "";
        for (var j = 0; j < c.drops.length; j++) {
          var drop = c.drops[j];
          var tile = document.createElement("div");
          tile.className = "drop-tile";
          tile.innerHTML =
            '<div class="drop-price">' + drop.value + ' 💎</div>' +
            '<div class="drop-title">' + drop.nft + '</div>' +
            '<div class="drop-meta">' + t("collectTag") + ' • ' + drop.rarity + '</div>';
          dropsGrid.appendChild(tile);
        }
      }

      function renderCasesGrid() {
        var grid = document.getElementById("cases-grid");
        grid.innerHTML = "";
        for (var i = 0; i < CASES.length; i++) {
          (function (c) {
            var card = document.createElement("div");
            card.className = "case-card";
            card.innerHTML =
              '<div class="case-art">' +
                '<div class="case-badge">' + c.badge + '</div>' +
                '<div class="nft-emblem">' + c.tag + '</div>' +
                '<div class="case-sub">' + c.drops[0].nft + ' • ' + c.drops[c.drops.length - 1].nft + '</div>' +
              '</div>' +
              '<div class="case-footer">' +
                '<div class="case-name">' + c.name + '</div>' +
                '<div class="price-pill ' + (c.free ? "free" : "") + '">' + (c.free ? "FREE" : c.price) + '</div>' +
              '</div>';
            card.addEventListener("click", function () { openCaseDetail(c); });
            grid.appendChild(card);
          })(CASES[i]);
        }
      }

      function renderInventory() {
        var box = document.getElementById("inv-container");
        if (!state.inventory.length) { box.textContent = t("emptyInv"); return; }
        box.innerHTML = "";
        for (var i = 0; i < state.inventory.length; i++) {
          (function (item) {
            var row = document.createElement("div");
            row.className = "row-item";
            row.innerHTML =
              '<div><b>' + item.nft + '</b> <span style="color:var(--muted); font-size:0.76rem;">' + item.serial + '</span> <span style="color:var(--gold);">' + item.value + ' 💎</span></div>' +
              '<div style="display:flex; gap:6px;">' +
                '<button class="mini-btn sell-btn">' + t("sell") + '</button>' +
                '<button class="mini-btn alt wd-btn">' + t("withdraw") + '</button>' +
              '</div>';
            row.querySelector(".sell-btn").addEventListener("click", function () {
              state.balance += item.value;
              state.inventory = state.inventory.filter(function (x) { return x.id !== item.id; });
              state.selectedUpgradeIds = state.selectedUpgradeIds.filter(function (id) { return id !== item.id; });
              applyTexts();
            });
            row.querySelector(".wd-btn").addEventListener("click", function () {
              if (tg) {
                try {
                  tg.sendData(JSON.stringify({ action: "withdraw", item_name: item.nft + " " + item.serial, value: item.value }));
                } catch (e) {}
              }
              alert(item.nft + " " + item.serial);
            });
            box.appendChild(row);
          })(state.inventory[i]);
        }
      }

      function renderUpgrade() {
        for (var s = 0; s < 3; s++) {
          var slotEl = document.getElementById("slot-" + s);
          var selId = state.selectedUpgradeIds[s];
          var found = null;
          for (var k = 0; k < state.inventory.length; k++) {
            if (state.inventory[k].id === selId) { found = state.inventory[k]; break; }
          }
          slotEl.textContent = found ? (found.nft + " (" + found.value + " 💎)") : ("#" + (s + 1));
        }

        var pool = document.getElementById("upg-pool");
        pool.innerHTML = "";
        if (!state.inventory.length) { pool.textContent = t("emptyInv"); return; }
        for (var i = 0; i < state.inventory.length; i++) {
          (function (item) {
            var picked = state.selectedUpgradeIds.indexOf(item.id) !== -1;
            var row = document.createElement("div");
            row.className = "row-item";
            row.innerHTML =
              '<div><b>' + item.nft + '</b> <span style="color:var(--muted); font-size:0.76rem;">' + item.serial + '</span> <span style="color:var(--gold);">' + item.value + ' 💎</span></div>' +
              '<button class="mini-btn ' + (picked ? "" : "alt") + '">' + (picked ? "✓" : "+") + '</button>';
            row.querySelector("button").addEventListener("click", function () {
              var idx = state.selectedUpgradeIds.indexOf(item.id);
              if (idx !== -1) {
                state.selectedUpgradeIds.splice(idx, 1);
              } else if (state.selectedUpgradeIds.length < 3) {
                state.selectedUpgradeIds.push(item.id);
              }
              renderUpgrade();
            });
            pool.appendChild(row);
          })(state.inventory[i]);
        }
      }

      document.getElementById("run-upgrade-btn").addEventListener("click", function () {
        if (state.selectedUpgradeIds.length !== 3) {
          document.getElementById("upg-status").textContent = t("needThree");
          return;
        }
        var sumVal = 0;
        for (var i = 0; i < state.inventory.length; i++) {
          if (state.selectedUpgradeIds.indexOf(state.inventory[i].id) !== -1) {
            sumVal += Number(state.inventory[i].value || 0);
          }
        }
        state.inventory = state.inventory.filter(function (x) {
          return state.selectedUpgradeIds.indexOf(x.id) === -1;
        });
        state.selectedUpgradeIds = [];

        var reward = UPGRADE_REWARDS[Math.floor(Math.random() * UPGRADE_REWARDS.length)];
        var newVal = Number(Math.max(reward.value, sumVal * 1.35).toFixed(1));
        var newItem = {
          id: Date.now() + Math.random(),
          nft: reward.nft,
          code: reward.code,
          rarity: reward.rarity,
          value: newVal,
          serial: makeSerial()
        };
        state.inventory.unshift(newItem);
        document.getElementById("upg-status").textContent = t("upgSuccess") + ": " + newItem.nft + " " + newItem.serial + " (" + newItem.value + " 💎)";
        renderInventory();
        renderUpgrade();
      });

      document.getElementById("back-to-cases").addEventListener("click", function () {
        document.getElementById("case-detail").classList.add("hidden");
        document.getElementById("cases-grid").classList.remove("hidden");
      });

      document.getElementById("spin-case-btn").addEventListener("click", function () {
        var c = state.activeCase;
        if (!c) return;
        if (state.balance < c.price) { document.getElementById("spin-status").textContent = t("noBal"); return; }
        state.balance -= c.price;
        document.getElementById("balance-display").textContent = "💎 " + Number(state.balance).toFixed(1);
        var won = c.drops[Math.floor(Math.random() * c.drops.length)];
        var track = document.getElementById("reel-track");
        track.style.transition = "transform 0.9s cubic-bezier(0.16, 0.88, 0.22, 1)";
        track.style.transform = "translateX(-280px)";
        setTimeout(function () {
          var ser = makeSerial();
          document.getElementById("spin-status").textContent = t("won") + ": " + won.nft + " " + ser + " (" + won.value + " 💎)";
          state.inventory.unshift({
            id: Date.now() + Math.random(),
            nft: won.nft,
            code: won.code,
            rarity: won.rarity,
            value: won.value,
            serial: ser
          });
          renderInventory();
          renderUpgrade();
        }, 920);
      });

      document.getElementById("copy-promo-btn").addEventListener("click", function () {
        if (!state.promoUsed) {
          state.promoUsed = true; state.balance += 50;
          document.getElementById("invite-feedback").textContent = t("promoOk");
          applyTexts();
        } else {
          document.getElementById("invite-feedback").textContent = t("promoUsed");
        }
      });

      var modal = document.getElementById("topup-modal");
      document.getElementById("open-topup-btn").addEventListener("click", function () { modal.classList.add("open"); });
      document.getElementById("close-topup-btn").addEventListener("click", function () { modal.classList.remove("open"); });
      document.getElementById("add-test-balance-btn").addEventListener("click", function () {
        state.balance += 100; modal.classList.remove("open"); applyTexts();
      });

      var views = ["home", "inv", "upgrade", "invite", "rating"];
      var navBtns = document.querySelectorAll(".nav-btn");
      for (var n = 0; n < navBtns.length; n++) {
        navBtns[n].addEventListener("click", function () {
          for (var m = 0; m < navBtns.length; m++) navBtns[m].classList.remove("active");
          this.classList.add("active");
          var target = this.getAttribute("data-view");
          for (var v = 0; v < views.length; v++) {
            var sec = document.getElementById("view-" + views[v]);
            if (views[v] === target) sec.classList.remove("hidden"); else sec.classList.add("hidden");
          }
        });
      }

      applyTexts();
    })();
  </script>
</body>
</html>
